<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시험 대비</title>
<style>
:root{--bg:#f7f8f5;--paper:#fff;--ink:#171917;--sub:#6f756d;--line:#dde2da;--soft:#f0f2ed;--accent:#dff39b;--accent2:#a8ce45;--ok:#e7f3d2;--okline:#9dc35c;--bad:#fbe6e2;--badline:#df9085;--star:#f3c64f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}button{font:inherit;color:inherit}.app{max-width:820px;margin:auto;min-height:100vh;padding:14px 12px 40px}.shell{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}.space-switch{display:inline-flex;padding:3px;background:#e9ece6;border-radius:10px}.space-btn{border:0;background:transparent;padding:8px 15px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;color:var(--sub)}.space-btn.active{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.06)}.topmeta{font-size:12px;color:var(--sub)}.bar{height:4px;background:#e6eae3;border-radius:999px;overflow:hidden;margin-bottom:16px}.bar span{display:block;height:100%;width:0;background:var(--accent2)}.page{background:#fff;border:1px solid var(--line);border-radius:17px;padding:24px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.08em;color:var(--sub);text-transform:uppercase}.title{font-size:28px;line-height:1.2;margin:7px 0 8px}.desc{margin:0;color:var(--sub);line-height:1.6}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.stat{background:var(--soft);border-radius:11px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--sub)}.main-action,.btn{border:0;border-radius:11px;padding:14px;font-weight:800;cursor:pointer}.main-action{width:100%;background:var(--ink);color:#fff}.btn{flex:1}.btn.primary{background:var(--ink);color:#fff}.btn.secondary{background:var(--soft)}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.action{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;text-align:left;font-weight:800;cursor:pointer}.action small{display:block;color:var(--sub);font-weight:500;margin-top:3px}.row{display:flex;gap:8px;margin-top:20px}.word{font-size:33px;font-weight:850;margin:12px 0 20px}.definition,.stem{font-family:Georgia,"Times New Roman",serif;font-size:23px;line-height:1.6}.meaning{display:none;margin-top:16px;padding-top:15px;border-top:1px solid var(--line);color:#414641}.meaning.show{display:block}.choices{display:grid;gap:8px;margin-top:22px}.choice{border:1px solid var(--line);background:#fff;border-radius:9px;padding:14px;text-align:left;font-size:16px;cursor:pointer}.choice b{display:inline-block;width:28px}.choice.correct{background:var(--ok);border-color:var(--okline)}.choice.wrong{background:var(--bad);border-color:var(--badline)}.choice:disabled{cursor:default}.feedback{min-height:42px;margin-top:15px}.completed{font-family:Georgia,"Times New Roman",serif;color:#434843;line-height:1.55;margin-top:7px;padding:11px 13px;background:var(--soft);border-radius:9px}.confirm-next{width:100%;margin-top:12px;border:0;border-radius:11px;background:var(--ink);color:#fff;padding:14px;font-weight:850;cursor:pointer}.quizhead{display:flex;justify-content:space-between;gap:12px}.qcount,.exit{font-size:12px;color:var(--sub)}.exit{border:0;background:none;cursor:pointer}.tabs,.lesson-tabs{display:flex;gap:6px;overflow:auto;margin:18px 0 12px}.tab,.lesson-tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;cursor:pointer;font-size:13px}.tab.active,.lesson-tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.word-list{border-top:1px solid var(--line)}.word-row{width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;border:0;border-bottom:1px solid var(--line);background:#fff;padding:14px 2px;text-align:left;cursor:pointer}.word-row small{display:block;color:var(--sub);margin-top:2px}.status{font-size:11px;background:var(--soft);border-radius:999px;padding:5px 8px}.status.bad{background:var(--bad)}.status.done{background:var(--ok)}
/* textbook */
.stagebar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 20px;position:sticky;top:6px;z-index:5;background:var(--bg);padding:5px 0}.stage{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 6px;cursor:pointer;text-align:center;font-size:11px;color:var(--sub);line-height:1.25}.stage b{display:block;color:var(--ink);font-size:12px;margin-bottom:2px}.stage.active{background:var(--ink);border-color:var(--ink);color:#d9ddd6}.stage.active b{color:#fff}.read-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 18px}.view-toggle{display:inline-flex;padding:3px;background:var(--soft);border-radius:9px}.view-toggle button{border:0;background:transparent;border-radius:7px;padding:7px 10px;font-size:12px;font-weight:750;color:var(--sub);cursor:pointer}.view-toggle button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.05)}.text-page{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}.text-page:first-of-type{border-top:0;margin-top:8px}.page-label{display:inline-block;font-size:12px;font-weight:850;letter-spacing:.04em;color:var(--sub);background:var(--soft);border-radius:999px;padding:6px 9px;margin-bottom:7px}.paragraph{padding:13px 0;border-bottom:1px solid #edf0eb}.paragraph:last-child{border-bottom:0}.sentence-row{padding:7px 0}.sentence-en{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.7}.sentence-ko{font-size:14px;line-height:1.65;color:var(--sub);margin-top:3px}.restore-card{border-top:1px solid var(--line);padding:15px 0}.restore-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}.restore-main{border:0;background:transparent;text-align:left;padding:0;cursor:pointer}.restore-ko{line-height:1.65;font-size:16px}.restore-en{display:none;margin-top:9px;padding:11px 13px;background:var(--soft);border-radius:9px;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.55}.restore-en.show{display:block}.bookmark{border:1px solid var(--line);background:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:20px;line-height:1}.bookmark.active{background:#fff7d9;border-color:#e2c25e;color:#b78700}.restore-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.restore-tools{display:flex;gap:6px;align-items:center}.mini-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer;white-space:nowrap}.mini-btn.active{background:#fff7d9;border-color:#e2c25e}.note{margin-top:12px;padding:11px 13px;background:var(--soft);border-radius:9px;color:#4f554d;line-height:1.5;font-size:13px}.coming{padding:36px 0;text-align:center;color:var(--sub)}.source-label{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.06em;margin-bottom:5px}.original-box{margin:14px 0 18px;padding:13px 14px;background:var(--soft);border-radius:10px}.original-box .original{font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.55}.variant-box{border:1px solid var(--line);border-radius:11px;padding:15px 14px;margin-top:10px}.variant-box .stem{font-size:21px}.judge-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.judge{border:1px solid var(--line);background:#fff;border-radius:10px;padding:15px;font-weight:850;cursor:pointer}.judge.correct{background:var(--ok);border-color:var(--okline)}.judge.wrong{background:var(--bad);border-color:var(--badline)}
@media(max-width:560px){.app{padding:10px 8px 28px}.page{padding:19px;border-radius:13px}.title{font-size:25px}.action-grid{grid-template-columns:1fr}.definition,.stem{font-size:21px}.summary{gap:5px}.stat{padding:10px}.stage{padding:8px 3px;font-size:10px}.stage b{font-size:11px}.sentence-en{font-size:17px}.space-btn{padding:7px 12px}.read-controls{align-items:flex-start;flex-direction:column}.judge-grid{grid-template-columns:1fr 1fr}.restore-progress{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <div class="space-switch"><button id="vocabSwitch" class="space-btn active" onclick="setSpace('vocab')">어휘</button><button id="textSwitch" class="space-btn" onclick="setSpace('textbook')">교과서</button></div>
    <div class="topmeta" id="topmeta"></div>
  </div>
  <div class="bar"><span id="globalBar"></span></div>
  <main id="screen"></main>
</div>
<script>
let VOCAB,TEXTBOOK,space=localStorage.getItem('exam-space')||'vocab';
const VKEY='voca-quiz-v2', BKEY='textbook-bookmarks-v1';
let vstate=JSON.parse(localStorage.getItem(VKEY)||'{"answered":{},"wrong":{},"doneWords":[],"lastWordIndex":0}');
let bookmarks=JSON.parse(localStorage.getItem(BKEY)||'{}');
let session=null,currentWord=null,currentQuestions=[],qIndex=0,locked=false,timer=null,studyQueue=[],studyPos=0;
let lessonId=4,stage=0,restoreIndex=0,tQuiz=null,tQuizIndex=0,tCorrect=0,tWrong=0,showTranslation=false,bookmarkOnly=false;
function saveV(){localStorage.setItem(VKEY,JSON.stringify(vstate))}function saveBookmarks(){localStorage.setItem(BKEY,JSON.stringify(bookmarks))}function screen(h){document.getElementById('screen').innerHTML=h}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function init(){[VOCAB,TEXTBOOK]=await Promise.all([fetch('data.json?'+Date.now()).then(r=>r.json()),fetch('textbook.json?'+Date.now()).then(r=>r.json())]);setSpace(space)}
function setSpace(s){space=s;localStorage.setItem('exam-space',s);document.getElementById('vocabSwitch').classList.toggle('active',s==='vocab');document.getElementById('textSwitch').classList.toggle('active',s==='textbook');if(s==='vocab')renderVocabHome();else renderTextbookHome()}
/* VOCAB */
function qKey(w,q){return w+'::'+q.question}function allQ(){return VOCAB.words.flatMap((w,wi)=>w.questions.map((q,qi)=>({word:w.word,wordIndex:wi,qIndex:qi,...q})))}function vTotal(){return allQ().length}function answered(){return Object.keys(vstate.answered).filter(k=>vstate.answered[k]).length}function wrongKeys(){return Object.keys(vstate.wrong).filter(k=>vstate.wrong[k])}function updateV(){let t=vTotal(),a=answered();document.getElementById('topmeta').textContent=`${a} / ${t}`;document.getElementById('globalBar').style.width=(t?a/t*100:0)+'%'}
function renderVocabHome(){session=null;updateV();let w=wrongKeys().length,t=vTotal(),a=answered();screen(`<section class="page"><div class="eyebrow">어휘 · 시험 대비</div><h1 class="title">${VOCAB.title}</h1><p class="desc">영영정의를 확인하고 빈칸 문제로 빠르게 점검합니다.</p><div class="summary"><div class="stat"><b>${t}</b><span>전체 문제</span></div><div class="stat"><b>${a}</b><span>푼 문제</span></div><div class="stat"><b>${w}</b><span>오답</span></div></div><button class="main-action" onclick="startVStudy(vstate.lastWordIndex||0)">이어 풀기</button><div class="action-grid"><button class="action" onclick="startVStudy(0)">전체 학습<small>정의 → 뜻 → 문제</small></button><button class="action" onclick="startVRandom()">랜덤 문제<small>전 범위를 섞어서</small></button><button class="action" onclick="startVWrong()">오답 복습<small>${w}문제</small></button><button class="action" onclick="renderWords()">전체 단어<small>미학습·오답·완료</small></button></div></section>`)}
function startVStudy(idx){session={mode:'study',correct:0,wrong:0};studyQueue=VOCAB.words.map((_,i)=>i).slice(idx);studyPos=0;openVWord(studyQueue[0])}function openVWord(i){vstate.lastWordIndex=i;saveV();currentWord=VOCAB.words[i];currentQuestions=currentWord.questions.map((q,qi)=>({word:currentWord.word,wordIndex:i,qIndex:qi,...q}));qIndex=0;renderVCard()}function renderVCard(){updateV();screen(`<section class="page"><div class="quizhead"><div><div class="eyebrow">영영 뜻</div><div class="word">${currentWord.word}</div></div><button class="exit" onclick="renderVocabHome()">나가기</button></div><div class="definition">${currentWord.definition}</div><div id="meaning" class="meaning"><b>${currentWord.word}</b> · ${currentWord.meaning}</div><div class="row"><button class="btn secondary" onclick="document.getElementById('meaning').classList.toggle('show')">뜻 보기</button><button class="btn primary" onclick="renderVQuiz()">문제 시작</button></div></section>`)}
function startVRandom(){session={mode:'random',correct:0,wrong:0};currentQuestions=shuffle(allQ()).map(x=>({...x,choices:shuffle(x.choices)}));qIndex=0;renderVQuiz()}function startVWrong(){let ks=new Set(wrongKeys()),qs=shuffle(allQ().filter(x=>ks.has(qKey(x.word,x)))).map(x=>({...x,choices:shuffle(x.choices)}));if(!qs.length){screen(`<section class="page"><h1 class="title">남은 오답이 없습니다.</h1><button class="main-action" onclick="renderVocabHome()">홈으로</button></section>`);return}session={mode:'wrong',correct:0,wrong:0};currentQuestions=qs;qIndex=0;renderVQuiz()}
function renderVQuiz(){locked=false;updateV();let q=currentQuestions[qIndex],label=session.mode==='random'?'랜덤 문제':session.mode==='wrong'?'오답 복습':'빈칸 문제';screen(`<section class="page"><div class="quizhead"><div><div class="eyebrow">${label}</div><div class="word">${q.word}</div></div><div class="qcount">${qIndex+1}/${currentQuestions.length}</div></div><div class="stem">${q.question}</div><div class="choices">${q.choices.map((c,i)=>`<button class="choice" onclick="answerV(${i})"><b>${['①','②','③','④'][i]}</b>${c}</button>`).join('')}</div><div id="feedback" class="feedback"></div></section>`)}
function answerV(i){if(locked)return;locked=true;let q=currentQuestions[qIndex],ok=q.choices[i]===q.answer,key=qKey(q.word,q);document.querySelectorAll('.choice').forEach((b,n)=>{b.disabled=true;if(q.choices[n]===q.answer)b.classList.add('correct');else if(n===i)b.classList.add('wrong')});vstate.answered[key]=true;if(ok){session.correct++;if(session.mode==='wrong')vstate.wrong[key]=false;document.getElementById('feedback').innerHTML='<b>정답</b>';saveV();timer=setTimeout(nextV,650)}else{session.wrong++;vstate.wrong[key]=true;document.getElementById('feedback').innerHTML=`<b>정답: ${q.answer}</b><div class="completed">${q.question.replace(/\(\s*\)/,q.answer)}</div><button class="confirm-next" onclick="nextV()">확인</button>`;saveV()}}
function nextV(){if(timer){clearTimeout(timer);timer=null}locked=false;if(qIndex<currentQuestions.length-1){qIndex++;renderVQuiz();return}if(session.mode==='study'){studyPos++;if(studyPos<studyQueue.length){openVWord(studyQueue[studyPos]);return}}renderVResult()}
function renderVResult(){let n=session.correct+session.wrong,p=n?Math.round(session.correct/n*100):0;screen(`<section class="page"><div class="eyebrow">결과</div><div class="title">${p}%</div><p class="desc">${n}문제 중 ${session.correct}개 정답 · ${session.wrong}개 오답</p><div class="row"><button class="btn secondary" onclick="renderVocabHome()">홈</button><button class="btn primary" onclick="startVWrong()">오답 다시 풀기</button></div></section>`)}
function renderWords(filter='all'){updateV();let rows=VOCAB.words.filter(w=>{let wc=w.questions.filter(q=>vstate.wrong[qKey(w.word,q)]).length,ac=w.questions.filter(q=>vstate.answered[qKey(w.word,q)]).length;if(filter==='unseen')return ac===0;if(filter==='wrong')return wc>0;if(filter==='done')return ac===w.questions.length&&wc===0;return true}).map(w=>{let wc=w.questions.filter(q=>vstate.wrong[qKey(w.word,q)]).length,ac=w.questions.filter(q=>vstate.answered[qKey(w.word,q)]).length,label=wc?`오답 ${wc}`:ac===w.questions.length?'완료':ac?`${ac}/${w.questions.length}`:'미학습',cls=wc?'bad':ac===w.questions.length?'done':'';return `<button class="word-row" onclick="startVStudy(${VOCAB.words.indexOf(w)})"><span><strong>${w.word}</strong><small>${w.definition}</small></span><span class="status ${cls}">${label}</span></button>`}).join('');screen(`<section class="page"><div class="quizhead"><div><div class="eyebrow">관리</div><h1 class="title">전체 단어</h1></div><button class="exit" onclick="renderVocabHome()">홈</button></div><div class="tabs">${[['all','전체'],['unseen','미학습'],['wrong','오답'],['done','완료']].map(x=>`<button class="tab ${filter===x[0]?'active':''}" onclick="renderWords('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="word-list">${rows||'<div class="coming">해당 단어가 없습니다.</div>'}</div></section>`)}
/* TEXTBOOK */
function lesson(){return TEXTBOOK.lessons.find(x=>x.id===lessonId)}function updateT(){document.getElementById('topmeta').textContent=`${lessonId}과`;document.getElementById('globalBar').style.width=((stage+1)/4*100)+'%'}function stageBar(){return `<div class="stagebar">${[['0','본문 전체'],['1','빠른 복원'],['2','핵심어'],['3','핵심문법']].map((x,i)=>`<button class="stage ${stage===i?'active':''}" onclick="goStage(${i})"><b>${x[0]}단계</b>${x[1]}</button>`).join('')}</div>`}
function renderTextbookHome(){updateT();let l=lesson();screen(`<section class="page"><div class="eyebrow">교과서 · 시험 대비</div><h1 class="title">교과서 본문 복습</h1><p class="desc">본문 전체 확인 → 빠른 복원 → 핵심어 빈칸 → 핵심문법 순서로 점검합니다.</p><div class="lesson-tabs">${TEXTBOOK.lessons.map(x=>`<button class="lesson-tab ${lessonId===x.id?'active':''}" onclick="selectLesson(${x.id})">${x.id}과</button>`).join('')}</div>${l.comingSoon?'<div class="coming">준비 중입니다.</div>':`${stageBar()}<button class="main-action" onclick="goStage(0)">${lessonId}과 복습 시작</button>`}</section>`)}function selectLesson(id){lessonId=id;stage=0;restoreIndex=0;bookmarkOnly=false;renderTextbookHome()}function goStage(n){stage=n;updateT();let l=lesson();if(l.comingSoon){renderTextbookHome();return}if(n===0)renderFullText();if(n===1){restoreIndex=0;renderRestore()}if(n===2)startTQuiz('keywords');if(n===3)startTQuiz('grammar')}
function translationMap(){let m={};lesson().restore.forEach(g=>g.sentences.forEach(s=>m[s.en]=s.ko));return m}
function renderFullText(){let l=lesson(),tm=translationMap(),html=l.fullText.map(pg=>`<section class="text-page"><div class="page-label">${pg.page}</div>${pg.paragraphs.map(p=>`<div class="paragraph">${p.map(s=>`<div class="sentence-row"><div class="sentence-en">${s}</div>${showTranslation?`<div class="sentence-ko">${tm[s]||''}</div>`:''}</div>`).join('')}</div>`).join('')}</section>`).join('');screen(`<section class="page"><div class="quizhead"><div><div class="eyebrow">0단계 · 읽기</div><h1 class="title">본문 전체</h1></div><button class="exit" onclick="renderTextbookHome()">교과서 홈</button></div>${stageBar()}<div class="read-controls"><p class="desc">페이지와 문단 흐름을 따라 전체 본문을 빠르게 읽습니다.</p><div class="view-toggle"><button class="${!showTranslation?'active':''}" onclick="setTranslation(false)">영어만</button><button class="${showTranslation?'active':''}" onclick="setTranslation(true)">영어+해석</button></div></div>${html}<div class="row"><button class="btn primary" onclick="goStage(1)">1단계 빠른 복원</button></div></section>`)}function setTranslation(v){showTranslation=v;renderFullText()}
function bookmarkKey(s){return lessonId+'::'+s.en}function isBookmarked(s){return !!bookmarks[bookmarkKey(s)]}function toggleBookmark(sIndex){let s=lesson().restore[restoreIndex].sentences[sIndex],k=bookmarkKey(s);bookmarks[k]=!bookmarks[k];if(!bookmarks[k])delete bookmarks[k];saveBookmarks();renderRestore()}function bookmarkedCount(){return lesson().restore.flatMap(g=>g.sentences).filter(isBookmarked).length}
function renderRestore(){let l=lesson(),g=l.restore[restoreIndex],items=g.sentences.map((s,i)=>({s,i})).filter(x=>!bookmarkOnly||isBookmarked(x.s));let cards=items.map(x=>`<div class="restore-card"><div class="restore-top"><button class="restore-main" onclick="toggleRestore(${x.i})"><div class="restore-ko">${x.s.ko}</div><div id="re${x.i}" class="restore-en">${x.s.en}</div></button><button class="bookmark ${isBookmarked(x.s)?'active':''}" onclick="toggleBookmark(${x.i})" aria-label="즐겨찾기">${isBookmarked(x.s)?'★':'☆'}</button></div></div>`).join('');if(!cards)cards='<div class="coming">이 문단에는 즐겨찾기한 문장이 없습니다.</div>';screen(`<section class="page"><div class="quizhead"><div><div class="eyebrow">1단계 · 빠른 복원</div><h1 class="title">${g.title}</h1></div><button class="exit" onclick="renderTextbookHome()">교과서 홈</button></div>${stageBar()}<div class="restore-progress"><span class="desc">한국어 어순을 보고 영어 문장을 떠올린 뒤 눌러 확인합니다.</span><div class="restore-tools"><button class="mini-btn ${bookmarkOnly?'active':''}" onclick="toggleBookmarkOnly()">★ 즐겨찾기 ${bookmarkedCount()}</button><span class="qcount">${restoreIndex+1}/${l.restore.length}</span></div></div>${cards}<div class="row"><button class="btn secondary" ${restoreIndex===0?'disabled':''} onclick="restorePrev()">이전 문단</button><button class="btn primary" onclick="restoreNext()">${restoreIndex===l.restore.length-1?'2단계로':'다음 문단'}</button></div></section>`)}function toggleRestore(i){let el=document.getElementById('re'+i);if(el)el.classList.toggle('show')}function toggleBookmarkOnly(){bookmarkOnly=!bookmarkOnly;renderRestore()}function restorePrev(){if(restoreIndex>0){restoreIndex--;renderRestore()}}function restoreNext(){if(restoreIndex<lesson().restore.length-1){restoreIndex++;renderRestore()}else goStage(2)}
function startTQuiz(type){tQuiz=type;tQuizIndex=0;tCorrect=0;tWrong=0;locked=false;renderTQuiz()}function grammarItem(q,i){let original=q.sentence.replace(/\(\s*\)/,q.answer),wrongs=q.choices.filter(x=>x!==q.answer),isCorrect=i%2===0,replacement=isCorrect?q.answer:wrongs[i%wrongs.length],variant=q.sentence.replace(/\(\s*\)/,replacement);return{original,variant,isCorrect}}
function renderTQuiz(){locked=false;let arr=tQuiz==='keywords'?lesson().keywords:lesson().grammar,q=arr[tQuizIndex];if(tQuiz==='grammar'){let g=grammarItem(q,tQuizIndex);screen(`<section class="page"><div class="quizhead"><div><div class="eyebrow">3단계 · 핵심문법</div><h1 class="title">${q.topic}</h1></div><div class="qcount">${tQuizIndex+1}/${arr.length}</div></div>${stageBar()}<div class="original-box"><div class="source-label">원문</div><div class="original">${g.original}</div></div><div class="variant-box"><div class="source-label">변형 문장</div><div class="stem">${g.variant}</div><div class="judge-grid"><button class="judge" onclick="answerGrammar(true)">맞음</button><button class="judge" onclick="answerGrammar(false)">틀림</button></div></div><div id="tfeedback" class="feedback"></div></section>`);return}screen(`<section class="page"><div class="quizhead"><div><div class="eyebrow">2단계 · 핵심어 빈칸</div><h1 class="title">핵심어 복원</h1></div><div class="qcount">${tQuizIndex+1}/${arr.length}</div></div>${stageBar()}<div class="stem">${q.sentence}</div><div class="choices">${q.choices.map((c,i)=>`<button class="choice" onclick="answerKeyword(${i})"><b>${['①','②','③','④'][i]}</b>${c}</button>`).join('')}</div><div id="tfeedback" class="feedback"></div></section>`)}
function answerKeyword(i){if(locked)return;locked=true;let q=lesson().keywords[tQuizIndex],ok=q.choices[i]===q.answer;document.querySelectorAll('.choice').forEach((b,n)=>{b.disabled=true;if(q.choices[n]===q.answer)b.classList.add('correct');else if(n===i)b.classList.add('wrong')});if(ok)tCorrect++;else tWrong++;let original=q.sentence.replace(/\(\s*\)/,q.answer);document.getElementById('tfeedback').innerHTML=`<b>${ok?'정답':'정답: '+q.answer}</b><div class="completed"><div class="source-label">완성된 원문</div>${original}</div>`;timer=setTimeout(nextT,ok?950:1500)}
function answerGrammar(choice){if(locked)return;locked=true;let q=lesson().grammar[tQuizIndex],g=grammarItem(q,tQuizIndex),ok=choice===g.isCorrect;document.querySelectorAll('.judge').forEach((b,n)=>{let val=n===0;if(val===g.isCorrect)b.classList.add('correct');else if(val===choice)b.classList.add('wrong');b.disabled=true});if(ok)tCorrect++;else tWrong++;document.getElementById('tfeedback').innerHTML=`<b>${ok?'정답':g.isCorrect?'정답: 맞음':'정답: 틀림'}</b><div class="completed"><div class="source-label">원문 확인</div>${g.original}</div><div class="note">${q.note}</div>`;timer=setTimeout(nextT,ok?1100:1700)}
function nextT(){locked=false;timer=null;let arr=tQuiz==='keywords'?lesson().keywords:lesson().grammar;if(tQuizIndex<arr.length-1){tQuizIndex++;renderTQuiz();return}renderTResult()}function renderTResult(){let n=tCorrect+tWrong,p=n?Math.round(tCorrect/n*100):0,next=tQuiz==='keywords'?`<button class="btn primary" onclick="goStage(3)">3단계 핵심문법</button>`:`<button class="btn primary" onclick="renderTextbookHome()">교과서 홈</button>`;screen(`<section class="page"><div class="eyebrow">${tQuiz==='keywords'?'핵심어':'핵심문법'} 완료</div><h1 class="title">${p}%</h1><p class="desc">${n}문제 중 ${tCorrect}개 정답 · ${tWrong}개 오답</p><div class="row"><button class="btn secondary" onclick="goStage(${tQuiz==='keywords'?2:3})">다시 풀기</button>${next}</div></section>`)}
init();
</script>
</body>
</html>
