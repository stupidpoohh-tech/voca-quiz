<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영영정의 빈칸 학습</title>
<style>
:root{--bg:#f7f8f5;--paper:#fff;--ink:#171917;--sub:#71766f;--line:#dfe3dc;--soft:#f0f2ed;--accent:#dff39b;--accent2:#a9cf45;--ok:#e6f3cf;--okLine:#9ec45b;--bad:#fbe5e1;--badLine:#df8f84}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}button{font:inherit;color:inherit}.app{max-width:760px;margin:0 auto;min-height:100vh;padding:18px 14px 42px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{font-size:13px;font-weight:800;letter-spacing:.08em}.topmeta{font-size:12px;color:var(--sub)}.bar{height:5px;background:#e8ebe5;border-radius:999px;overflow:hidden;margin-bottom:20px}.bar>span{display:block;height:100%;background:var(--accent2);width:0}.page{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--sub);text-transform:uppercase}.title{font-size:28px;line-height:1.2;margin:7px 0 8px}.desc{margin:0;color:var(--sub);line-height:1.6}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.stat{background:var(--soft);border-radius:12px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--sub)}.main-action{width:100%;border:0;background:var(--ink);color:#fff;border-radius:13px;padding:16px;font-weight:800;cursor:pointer}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.action{border:1px solid var(--line);background:#fff;border-radius:13px;padding:14px;text-align:left;font-weight:750;cursor:pointer}.action small{display:block;margin-top:3px;color:var(--sub);font-weight:500}.linkbtn{width:100%;border:0;background:transparent;padding:16px 0 0;color:var(--sub);cursor:pointer}.word{font-size:34px;font-weight:850;margin:12px 0 20px}.definition,.stem{font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1.55}.meaning{display:none;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:16px;color:#434843}.meaning.show{display:block}.row{display:flex;gap:9px;margin-top:22px}.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:800;cursor:pointer}.btn.primary{background:var(--ink);color:#fff}.btn.secondary{background:var(--soft)}.quizhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.qcount{font-size:12px;color:var(--sub);white-space:nowrap}.choices{display:grid;gap:8px;margin-top:24px}.choice{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:15px 14px;text-align:left;font-size:17px;cursor:pointer}.choice b{display:inline-block;width:28px}.choice.correct{background:var(--ok);border-color:var(--okLine)}.choice.wrong{background:var(--bad);border-color:var(--badLine)}.choice:disabled{cursor:default}.feedback{min-height:46px;margin-top:16px}.feedback strong{display:block;margin-bottom:6px}.completed-sentence{font-family:Georgia,"Times New Roman",serif;color:var(--sub);line-height:1.5}.result-num{font-size:44px;font-weight:850;margin:14px 0 2px}.tabs{display:flex;gap:6px;overflow:auto;margin:18px 0 12px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;cursor:pointer;font-size:13px}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.word-list{border-top:1px solid var(--line)}.word-row{width:100%;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;border:0;border-bottom:1px solid var(--line);background:#fff;padding:15px 2px;text-align:left;cursor:pointer}.word-row strong{display:block}.word-row small{color:var(--sub)}.status{font-size:12px;padding:5px 8px;border-radius:999px;background:var(--soft)}.status.bad{background:var(--bad)}.status.done{background:var(--ok)}.empty{text-align:center;color:var(--sub);padding:30px 0}.exit{border:0;background:transparent;color:var(--sub);padding:0;cursor:pointer;font-size:12px}.hint{font-size:12px;color:var(--sub);margin-top:10px}.danger-link{border:0;background:transparent;color:#9b5148;padding:12px 0 0;cursor:pointer;font-size:12px}
@media(max-width:520px){.app{padding:12px 10px 28px}.page{padding:20px;border-radius:14px}.title{font-size:25px}.definition,.stem{font-size:22px}.word{font-size:30px}.summary{gap:6px}.stat{padding:10px}.action-grid{grid-template-columns:1fr}.choice{font-size:16px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><div class="brand" id="brand">LESSON 5</div><div class="topmeta" id="topmeta"></div></div>
  <div class="bar"><span id="globalBar"></span></div>
  <main id="screen"></main>
</div>
<script>
let DATA;
const KEY='voca-quiz-v2';
let state=JSON.parse(localStorage.getItem(KEY)||'{"answered":{},"wrong":{},"doneWords":[],"lastWordIndex":0}');
let session=null, currentWord=null, currentQuestions=[], qIndex=0, locked=false, studyQueue=[], studyPos=0;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function screen(html){document.getElementById('screen').innerHTML=html}
function qKey(word,q){return word+'::'+q.question}
function allQuestions(){return DATA.words.flatMap((w,wi)=>w.questions.map((q,qi)=>({word:w.word,wordIndex:wi,qIndex:qi,...q}))) }
function total(){return allQuestions().length}
function answeredCount(){return Object.keys(state.answered).filter(k=>state.answered[k]).length}
function unresolvedWrong(){return Object.keys(state.wrong).filter(k=>state.wrong[k])}
function wordWrongCount(w){return w.questions.filter(q=>state.wrong[qKey(w.word,q)]).length}
function wordAnsweredCount(w){return w.questions.filter(q=>state.answered[qKey(w.word,q)]).length}
function updateGlobal(){const t=total(),a=answeredCount();document.getElementById('topmeta').textContent=`${a} / ${t}`;document.getElementById('globalBar').style.width=(t?Math.min(100,a/t*100):0)+'%'}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function initStateFromLegacy(){try{const old=JSON.parse(localStorage.getItem('engdef-state')||'null');if(old&&old.done&&!state.doneWords.length){state.doneWords=[...old.done];save()}}catch(e){}}
async function init(){DATA=await fetch('data.json?'+Date.now()).then(r=>r.json());document.getElementById('brand').textContent=(DATA.lesson||'LESSON 5').toUpperCase();initStateFromLegacy();renderHome()}
function renderHome(){session=null;currentWord=null;updateGlobal();const wrong=unresolvedWrong().length;const t=total(),a=answeredCount();screen(`<section class="page"><div class="eyebrow">시험 대비</div><h1 class="title">${DATA.title}</h1><p class="desc">영영정의를 빠르게 확인하고, 빈칸 문제로 시험 직전 범위를 점검합니다.</p><div class="summary"><div class="stat"><b>${t}</b><span>전체 문제</span></div><div class="stat"><b>${a}</b><span>푼 문제</span></div><div class="stat"><b>${wrong}</b><span>오답</span></div></div><button class="main-action" onclick="continueStudy()">이어 풀기</button><div class="action-grid"><button class="action" onclick="startFullStudy()">전체 학습<small>단어별 정의 → 뜻 → 문제</small></button><button class="action" onclick="startRandom()">랜덤 문제<small>전 범위를 섞어서 실전처럼</small></button><button class="action" onclick="startWrong()">오답 복습<small>${wrong}문제 다시 확인</small></button><button class="action" onclick="renderWords()">전체 단어<small>미학습·오답·완료 관리</small></button></div></section>`)}
function continueStudy(){let idx=Math.min(state.lastWordIndex||0,DATA.words.length-1);startStudyAt(idx)}
function startFullStudy(){state.lastWordIndex=0;save();startStudyAt(0)}
function startStudyAt(idx){session={mode:'study',correct:0,wrong:0,total:0};studyQueue=DATA.words.map((_,i)=>i).slice(idx);studyPos=0;openStudyWord(studyQueue[studyPos])}
function openStudyWord(idx){state.lastWordIndex=idx;save();currentWord=DATA.words[idx];currentQuestions=currentWord.questions.map((q,qi)=>({word:currentWord.word,wordIndex:idx,qIndex:qi,...q}));qIndex=0;renderStudyCard()}
function renderStudyCard(){updateGlobal();screen(`<section class="page"><div class="quizhead"><div><div class="eyebrow">영영 뜻</div><div class="word">${currentWord.word}</div></div><button class="exit" onclick="renderHome()">나가기</button></div><div class="definition">${currentWord.definition}</div><div class="meaning" id="meaning"><b>${currentWord.word}</b> · ${currentWord.meaning}</div><div class="row"><button class="btn secondary" id="meaningBtn" onclick="toggleMeaning()">뜻 보기</button><button class="btn primary" onclick="beginWordQuiz()">문제 시작</button></div></section>`)}
function toggleMeaning(){document.getElementById('meaning').classList.toggle('show');document.getElementById('meaningBtn').textContent=document.getElementById('meaning').classList.contains('show')?'뜻 숨기기':'뜻 보기'}
function beginWordQuiz(){qIndex=0;renderQuiz()}
function startRandom(){const qs=shuffle(allQuestions()).map(x=>({...x,choices:shuffle(x.choices)}));startQuizSession('random',qs)}
function startWrong(){const keys=new Set(unresolvedWrong());const qs=shuffle(allQuestions().filter(x=>keys.has(qKey(x.word,x)))).map(x=>({...x,choices:shuffle(x.choices)}));if(!qs.length){screen(`<section class="page"><div class="eyebrow">오답 복습</div><h1 class="title">남은 오답이 없습니다.</h1><div class="row"><button class="btn primary" onclick="renderHome()">홈으로</button></div></section>`);return}startQuizSession('wrong',qs)}
function startQuizSession(mode,qs){session={mode,correct:0,wrong:0,total:qs.length};currentQuestions=qs;qIndex=0;renderQuiz()}
function renderQuiz(){locked=false;updateGlobal();const q=currentQuestions[qIndex];const mode=session?.mode||'study';const label=mode==='random'?'랜덤 문제':mode==='wrong'?'오답 복습':'빈칸 문제';const count=mode==='study'?`${qIndex+1}/${currentQuestions.length}`:`${qIndex+1}/${session.total}`;screen(`<section class="page" onclick="skipWait(event)"><div class="quizhead"><div><div class="eyebrow">${label}</div><div class="word">${q.word}</div></div><div><div class="qcount">${count}</div><button class="exit" onclick="event.stopPropagation();renderHome()">나가기</button></div></div><div class="stem">${q.question}</div><div class="choices">${q.choices.map((c,i)=>`<button class="choice" id="c${i}" onclick="event.stopPropagation();answer(${i})"><b>${['①','②','③','④'][i]}</b>${c}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="hint">정답 선택 후 자동으로 다음 문제로 넘어갑니다.</div></section>`)}
let timer=null;function answer(i){if(locked)return;locked=true;const q=currentQuestions[qIndex],selected=q.choices[i],ok=selected===q.answer,key=qKey(q.word,q);document.querySelectorAll('.choice').forEach((b,idx)=>{b.disabled=true;if(q.choices[idx]===q.answer)b.classList.add('correct');else if(idx===i)b.classList.add('wrong')});state.answered[key]=true;if(ok){if(session)session.correct++;if(session?.mode==='wrong')state.wrong[key]=false;document.getElementById('feedback').innerHTML='<strong>정답</strong>'}else{if(session)session.wrong++;state.wrong[key]=true;document.getElementById('feedback').innerHTML=`<strong>정답: ${q.answer}</strong><div class="completed-sentence">${completeSentence(q.question,q.answer)}</div>`}save();updateGlobal();timer=setTimeout(nextAfterAnswer,ok?700:1300)}
function completeSentence(s,a){return s.replace(/\(\s*\)/,a)}
function skipWait(e){if(locked&&timer){clearTimeout(timer);timer=null;nextAfterAnswer()}}
function nextAfterAnswer(){timer=null;if(session?.mode==='study'){if(qIndex<currentQuestions.length-1){qIndex++;renderQuiz();return}if(!state.doneWords.includes(currentWord.word))state.doneWords.push(currentWord.word);studyPos++;if(studyPos<studyQueue.length){save();openStudyWord(studyQueue[studyPos]);return}renderResult();return}if(qIndex<currentQuestions.length-1){qIndex++;renderQuiz();return}renderResult()}
function renderResult(){updateGlobal();const totalDone=(session?.correct||0)+(session?.wrong||0),correct=session?.correct||0,wrong=session?.wrong||0,pct=totalDone?Math.round(correct/totalDone*100):0;const wrongBtn=wrong?`<button class="btn primary" onclick="startWrong()">오답 다시 풀기</button>`:`<button class="btn primary" onclick="renderHome()">홈으로</button>`;screen(`<section class="page"><div class="eyebrow">결과</div><div class="result-num">${pct}%</div><p class="desc">${totalDone}문제 중 ${correct}개 정답 · ${wrong}개 오답</p><div class="row"><button class="btn secondary" onclick="renderHome()">홈</button>${wrongBtn}</div></section>`)}
function renderWords(filter='all'){updateGlobal();const rows=DATA.words.filter(w=>{const wc=wordWrongCount(w),ac=wordAnsweredCount(w);if(filter==='unseen')return ac===0;if(filter==='wrong')return wc>0;if(filter==='done')return ac===w.questions.length&&wc===0;return true}).map((w)=>{const wc=wordWrongCount(w),ac=wordAnsweredCount(w);let label='미학습',cls='';if(wc){label=`오답 ${wc}`;cls='bad'}else if(ac===w.questions.length){label='완료';cls='done'}else if(ac>0){label=`${ac}/${w.questions.length}`};return `<button class="word-row" onclick="startSingleWord('${w.word.replace(/'/g,"\\'")}')"><div><strong>${w.word}</strong><small>${w.definition}</small></div><span class="status ${cls}">${label}</span></button>`}).join('');screen(`<section class="page"><div class="quizhead"><div><div class="eyebrow">범위 관리</div><h1 class="title">전체 단어</h1></div><button class="exit" onclick="renderHome()">홈</button></div><div class="tabs"><button class="tab ${filter==='all'?'active':''}" onclick="renderWords('all')">전체</button><button class="tab ${filter==='unseen'?'active':''}" onclick="renderWords('unseen')">미학습</button><button class="tab ${filter==='wrong'?'active':''}" onclick="renderWords('wrong')">오답</button><button class="tab ${filter==='done'?'active':''}" onclick="renderWords('done')">완료</button></div><div class="word-list">${rows||'<div class="empty">해당 단어가 없습니다.</div>'}</div><button class="danger-link" onclick="resetProgress()">학습 기록 초기화</button></section>`)}
function startSingleWord(word){const idx=DATA.words.findIndex(w=>w.word===word);session={mode:'study',correct:0,wrong:0,total:DATA.words[idx].questions.length};studyQueue=[idx];studyPos=0;openStudyWord(idx)}
function resetProgress(){if(confirm('정답·오답·완료 기록을 모두 초기화할까요?')){state={answered:{},wrong:{},doneWords:[],lastWordIndex:0};save();renderWords('all')}}
init();
</script>
</body>
</html>
