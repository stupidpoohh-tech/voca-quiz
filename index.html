<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영영정의 빈칸 학습</title>
<style>
:root{
  --bg:#f6f8f3; --card:#ffffff; --ink:#172016; --sub:#6a7468;
  --line:#e5eadf; --accent:#dff39b; --accent-strong:#9bc53d;
  --danger:#f7d6d2; --ok:#e0f2c8; --shadow:0 14px 36px rgba(29,44,23,.08);
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
button{font:inherit}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding:24px 18px 48px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--sub)}
.progress{font-size:13px;color:var(--sub)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px}
h1{font-size:28px;margin:0 0 8px} h2{font-size:24px;margin:0 0 18px}
.desc{color:var(--sub);line-height:1.65;margin:0}
.word-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}
.word-btn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px;text-align:left;cursor:pointer}
.word-btn:hover{border-color:#cbd7bd}.word-btn.done{background:#f4f9e8}
.word-btn strong{display:block;font-size:17px;margin-bottom:4px}.word-btn span{font-size:12px;color:var(--sub)}
.hero-word{font-size:34px;font-weight:800;margin-bottom:16px}
.definition{font-family:Georgia,"Times New Roman",serif;font-size:25px;line-height:1.55;margin:18px 0 8px}
.meaning{font-size:16px;line-height:1.7;color:var(--sub);padding-top:14px;border-top:1px solid var(--line);margin-top:20px}
.stage-label{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.08em;text-transform:uppercase}
.actions{display:flex;gap:10px;margin-top:26px}
.primary,.secondary{border:0;border-radius:14px;padding:14px 18px;cursor:pointer;font-weight:750}
.primary{background:var(--ink);color:white;flex:1}.secondary{background:#eef2e9;color:var(--ink)}
.quiz-stem{font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1.6;margin:20px 0}
.choice-list{display:grid;gap:10px}.choice{border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px 16px;text-align:left;cursor:pointer;font-size:17px}
.choice.correct{background:var(--ok);border-color:#b8d88c}.choice.wrong{background:var(--danger);border-color:#e7aaa2}
.choice:disabled{cursor:default;color:inherit}
.feedback{min-height:24px;margin-top:16px;font-weight:700}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.chip{background:#eef2e9;border-radius:999px;padding:8px 11px;font-size:12px;color:#536050}
.empty{color:var(--sub);text-align:center;padding:30px}
@media(max-width:520px){
 .app{padding:16px 12px 34px}.panel{padding:20px;border-radius:20px}
 .word-grid{grid-template-columns:1fr}.definition,.quiz-stem{font-size:22px}.hero-word{font-size:30px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand" id="brand">LESSON 5</div>
    <div class="progress" id="progress"></div>
  </div>
  <main id="screen"></main>
</div>
<script>
let DATA;
let state = JSON.parse(localStorage.getItem('engdef-state') || '{"done":[],"wrong":{},"score":{}}');
let current = null, stage = 'home', qIndex = 0, locked = false;

async function init(){
  DATA = await fetch('data.json').then(r=>r.json());
  renderHome();
}
function save(){localStorage.setItem('engdef-state', JSON.stringify(state))}
function el(html){document.getElementById('screen').innerHTML=html}
function renderHome(){
  stage='home'; current=null;
  document.getElementById('progress').textContent = `${state.done.length}/${DATA.words.length} 완료`;
  const cards = DATA.words.map(w => `
    <button class="word-btn ${state.done.includes(w.word)?'done':''}" onclick="openWord('${w.word.replace(/'/g,"\\'")}')">
      <strong>${w.word}</strong>
      <span>${w.questions.length}문제 · ${state.done.includes(w.word)?'완료':'학습 전'}</span>
    </button>`).join('');
  el(`<section class="panel">
    <div class="stage-label">${DATA.lesson}</div>
    <h1>${DATA.title}</h1>
    <p class="desc">단어를 누르면 영영정의 → 해석 → 빈칸 문제 순서로 학습합니다.</p>
    <div class="stats">
      <span class="chip">총 ${DATA.words.length}단어</span>
      <span class="chip">총 ${DATA.words.reduce((a,w)=>a+w.questions.length,0)}문제</span>
      <span class="chip">오답 ${Object.values(state.wrong).reduce((a,b)=>a+b,0)}회</span>
    </div>
    <div class="word-grid">${cards}</div>
  </section>`);
}
function openWord(word){
  current = DATA.words.find(w=>w.word===word); qIndex=0; locked=false; stage='definition'; renderDefinition();
}
function renderDefinition(){
  document.getElementById('progress').textContent = '1 / ' + (current.questions.length+2);
  el(`<section class="panel">
    <div class="stage-label">영영 뜻</div>
    <div class="hero-word">${current.word}</div>
    <div class="definition">${current.definition}</div>
    <div class="actions">
      <button class="secondary" onclick="renderHome()">목록</button>
      <button class="primary" onclick="renderMeaning()">다음</button>
    </div>
  </section>`);
}
function renderMeaning(){
  stage='meaning';
  document.getElementById('progress').textContent = '2 / ' + (current.questions.length+2);
  el(`<section class="panel">
    <div class="stage-label">뜻 확인</div>
    <div class="hero-word">${current.word}</div>
    <div class="definition">${current.definition}</div>
    <div class="meaning"><strong>${current.word}</strong> · ${current.meaning}</div>
    <div class="actions">
      <button class="secondary" onclick="renderDefinition()">이전</button>
      <button class="primary" onclick="startQuiz()">문제 풀기</button>
    </div>
  </section>`);
}
function startQuiz(){qIndex=0; locked=false; renderQuiz()}
function renderQuiz(){
  const q=current.questions[qIndex]; locked=false;
  document.getElementById('progress').textContent = `${qIndex+3} / ${current.questions.length+2}`;
  el(`<section class="panel">
    <div class="stage-label">빈칸 문제 ${qIndex+1}/${current.questions.length}</div>
    <div class="hero-word">${current.word}</div>
    <div class="quiz-stem">${q.question}</div>
    <div class="choice-list">
      ${q.choices.map((c,i)=>`<button class="choice" id="c${i}" onclick="answer(${i})">${i+1}. ${c}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="actions" id="nextArea"></div>
  </section>`);
}
function answer(i){
  if(locked)return; locked=true;
  const q=current.questions[qIndex], selected=q.choices[i], ok=selected===q.answer;
  [...document.querySelectorAll('.choice')].forEach((b,idx)=>{
    b.disabled=true;
    if(q.choices[idx]===q.answer)b.classList.add('correct');
    else if(idx===i)b.classList.add('wrong');
  });
  const key=current.word+'::'+q.answer;
  if(!ok) state.wrong[key]=(state.wrong[key]||0)+1;
  state.score[key]=ok;
  save();
  document.getElementById('feedback').textContent = ok ? '정답입니다.' : `정답: ${q.answer}`;
  document.getElementById('nextArea').innerHTML =
    `<button class="primary" onclick="nextQuiz()">${qIndex===current.questions.length-1?'완료':'다음 문제'}</button>`;
}
function nextQuiz(){
  if(qIndex < current.questions.length-1){qIndex++;renderQuiz();return;}
  if(!state.done.includes(current.word)) state.done.push(current.word);
  save(); renderComplete();
}
function renderComplete(){
  const qs=current.questions;
  const right=qs.filter(q=>state.score[current.word+'::'+q.answer]).length;
  document.getElementById('progress').textContent='완료';
  el(`<section class="panel">
    <div class="stage-label">학습 완료</div>
    <div class="hero-word">${current.word}</div>
    <h2>${right} / ${qs.length} 정답</h2>
    <p class="desc">${current.definition}</p>
    <div class="actions">
      <button class="secondary" onclick="startQuiz()">다시 풀기</button>
      <button class="primary" onclick="nextWord()">다음 단어</button>
    </div>
  </section>`);
}
function nextWord(){
  const idx=DATA.words.findIndex(w=>w.word===current.word);
  if(idx<DATA.words.length-1) openWord(DATA.words[idx+1].word);
  else renderHome();
}
init();
</script>
</body>
</html>
