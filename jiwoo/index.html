<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>지우 영어 시험대비</title><style>:root{--bg:#f7f8f3;--paper:#fff;--ink:#1b1e19;--sub:#70776c;--line:#dfe5da;--soft:#f0f3eb;--accent:#a9cf4d;--ok:#e7f3d2;--bad:#fbe4df;--star:#f4c84c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{max-width:820px;margin:auto;padding:14px 12px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.name{font-weight:900}.switch{display:flex;background:#e9ede4;padding:3px;border-radius:11px}.switch button{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:800;color:var(--sub)}.switch .active{background:white;color:var(--ink)}.page{background:white;border:1px solid var(--line);border-radius:18px;padding:22px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--sub)}h1{font-size:28px;margin:7px 0 9px}.desc{color:var(--sub);line-height:1.6}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:var(--soft);padding:12px;border-radius:12px}.stat b{display:block;font-size:20px}.actiongrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.action,.main,.btn,.choice,.stage,.pill,.judge,.bookmark{cursor:pointer}.action{border:1px solid var(--line);background:#fff;padding:14px;border-radius:12px;text-align:left;font-weight:800}.action small{display:block;color:var(--sub);font-weight:500;margin-top:4px}.main{width:100%;border:0;background:var(--ink);color:#fff;padding:14px;border-radius:12px;font-weight:850}.row{display:flex;gap:8px;margin-top:18px}.btn{flex:1;border:0;padding:13px;border-radius:11px;font-weight:800}.btn.dark{background:var(--ink);color:#fff}.btn.soft{background:var(--soft)}.word{font-size:34px;font-weight:900;margin:12px 0}.serif{font-family:Georgia,"Times New Roman",serif;font-size:22px;line-height:1.6}.meaning{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);color:#42483f}.meaning.show{display:block}.choices{display:grid;gap:8px;margin-top:20px}.choice{border:1px solid var(--line);background:#fff;padding:14px;border-radius:10px;text-align:left;font-size:16px}.choice.correct,.judge.correct{background:var(--ok)}.choice.wrong,.judge.wrong{background:var(--bad)}.feedback{margin-top:14px;min-height:36px}.completed,.note{background:var(--soft);padding:12px;border-radius:10px;margin-top:9px;line-height:1.55}.confirm{width:100%;border:0;background:var(--ink);color:#fff;padding:13px;border-radius:10px;font-weight:850;margin-top:10px}.lessons,.tabs{display:flex;gap:6px;overflow:auto;margin:16px 0}.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px}.pill.active{background:var(--ink);color:#fff}.stagebar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:4px;background:var(--bg);padding:5px 0;z-index:4}.stage{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 5px;text-align:center;font-size:11px;color:var(--sub)}.stage b{display:block;color:var(--ink);font-size:12px}.stage.active{background:var(--ink);color:#ddd}.stage.active b{color:#fff}.textpage{padding-top:18px;margin-top:18px;border-top:1px solid var(--line)}.label{display:inline-block;background:var(--soft);padding:6px 9px;border-radius:999px;font-size:12px;font-weight:850}.sentence{padding:8px 0}.en{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.65}.ko{font-size:14px;color:var(--sub);line-height:1.6}.toggle{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:9px;width:max-content;margin:12px 0}.toggle button{border:0;background:transparent;padding:7px 10px;border-radius:7px}.toggle .active{background:#fff}.restore{border-top:1px solid var(--line);padding:14px 0}.restoretop{display:grid;grid-template-columns:1fr auto;gap:8px}.restoremain{border:0;background:none;text-align:left;padding:0}.answeren{display:none;background:var(--soft);margin-top:8px;padding:11px;border-radius:9px;font-family:Georgia,"Times New Roman",serif}.answeren.show{display:block}.bookmark{border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:10px;font-size:20px}.bookmark.on{background:#fff6d5}.judgegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.judge{border:1px solid var(--line);background:#fff;padding:15px;border-radius:10px;font-weight:850}.manage{border-top:1px solid var(--line)}.manage button{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:13px 0;text-align:left}.manage small{display:block;color:var(--sub)}@media(max-width:560px){.page{padding:18px}.actiongrid{grid-template-columns:1fr}h1{font-size:25px}.serif{font-size:20px}.stage{padding:8px 2px;font-size:10px}.stage b{font-size:11px}}</style></head><body><div class="app"><div class="top"><div class="name">지우 영어 시험대비</div><div class="switch"><button id="vs" onclick="space='vocab';renderHome()">어휘</button><button id="ts" onclick="space='text';renderHome()">교과서</button></div></div><main id="screen"></main></div><script>let V,T,space=localStorage.getItem('jiwoo-space')||'vocab',lessonId=4,stage=0,restoreIndex=0,showKo=false,bookmarkOnly=false,qArr=[],qi=0,mode='',locked=false,timer=null;let state=JSON.parse(localStorage.getItem('jiwoo-vocab')||'{"answered":{},"wrong":{},"last":0}');let marks=JSON.parse(localStorage.getItem('jiwoo-marks')||'{}');const $=s=>document.querySelector(s),S=h=>$('#screen').innerHTML=h,save=()=>localStorage.setItem('jiwoo-vocab',JSON.stringify(state)),saveM=()=>localStorage.setItem('jiwoo-marks',JSON.stringify(marks));function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}async function init(){let [b,e,t]=await Promise.all([fetch('../data.json?'+Date.now()).then(r=>r.json()),fetch('../data-extra.json?'+Date.now()).then(r=>r.json()),fetch('../textbook.json?'+Date.now()).then(r=>r.json())]);V={title:'지우 영영정의 빈칸 학습',words:[...(b.words||[]),...(e.words||[])]};T={lessons:(t.lessons||[]).filter(x=>[4,5,6].includes(x.id))};renderHome()}function renderHome(){localStorage.setItem('jiwoo-space',space);$('#vs').classList.toggle('active',space==='vocab');$('#ts').classList.toggle('active',space==='text');space==='vocab'?vHome():tHome()}function allQ(){return V.words.flatMap((w,wi)=>w.questions.map((q,qj)=>({...q,word:w.word,wi,qj})))}function key(q){return q.word+'::'+q.question}function vHome(){let total=allQ().length,done=Object.values(state.answered).filter(Boolean).length,wrong=Object.values(state.wrong).filter(Boolean).length;S(`<section class="page"><div class="eyebrow">어휘 · 시험 전 대비</div><h1>${V.title}</h1><p class="desc">영영정의를 보고 빈칸을 빠르게 복원합니다.</p><div class="summary"><div class="stat"><b>${total}</b><span>전체</span></div><div class="stat"><b>${done}</b><span>풀이</span></div><div class="stat"><b>${wrong}</b><span>오답</span></div></div><button class="main" onclick="study(${state.last||0})">이어 풀기</button><div class="actiongrid"><button class="action" onclick="study(0)">전체 학습<small>정의→뜻→문제</small></button><button class="action" onclick="randomQ()">랜덤 문제<small>전 범위 섞기</small></button><button class="action" onclick="wrongQ()">오답 복습<small>${wrong}문제</small></button><button class="action" onclick="manage()">전체 단어<small>상태 확인</small></button></div></section>`)}function study(i){state.last=i;save();let w=V.words[i];mode='study';qArr=w.questions.map(q=>({...q,word:w.word,wi:i}));qi=0;S(`<section class="page"><div class="eyebrow">영영 뜻</div><div class="word">${w.word}</div><div class="serif">${w.definition}</div><div id="mean" class="meaning"><b>${w.word}</b> · ${w.meaning}</div><div class="row"><button class="btn soft" onclick="$('#mean').classList.toggle('show')">뜻 보기</button><button class="btn dark" onclick="quiz()">문제 시작</button></div></section>`)}function randomQ(){mode='random';qArr=shuffle(allQ()).map(q=>({...q,choices:shuffle(q.choices)}));qi=0;quiz()}function wrongQ(){let set=new Set(Object.keys(state.wrong).filter(k=>state.wrong[k]));qArr=shuffle(allQ().filter(q=>set.has(key(q)))).map(q=>({...q,choices:shuffle(q.choices)}));if(!qArr.length){S('<section class="page"><h1>남은 오답이 없습니다.</h1><button class="main" onclick="vHome()">홈</button></section>');return}mode='wrong';qi=0;quiz()}function quiz(){locked=false;let q=qArr[qi];S(`<section class="page"><div class="eyebrow">${mode==='wrong'?'오답 복습':mode==='random'?'랜덤 문제':'빈칸 문제'} · ${qi+1}/${qArr.length}</div><div class="word">${q.word}</div><div class="serif">${q.question}</div><div class="choices">${q.choices.map((c,i)=>`<button class="choice" onclick="ans(${i})"><b>${['①','②','③','④'][i]}</b> ${c}</button>`).join('')}</div><div id="fb" class="feedback"></div></section>`)}function ans(i){if(locked)return;locked=true;let q=qArr[qi],ok=q.choices[i]===q.answer,k=key(q);document.querySelectorAll('.choice').forEach((b,n)=>{b.disabled=true;if(q.choices[n]===q.answer)b.classList.add('correct');else if(n===i)b.classList.add('wrong')});state.answered[k]=true;if(ok){if(mode==='wrong')state.wrong[k]=false;$('#fb').innerHTML='<b>정답</b>';save();timer=setTimeout(next,650)}else{state.wrong[k]=true;$('#fb').innerHTML=`<b>정답: ${q.answer}</b><div class="completed">${q.question.replace(/\(\s*\)/,q.answer)}</div><button class="confirm" onclick="next()">확인</button>`;save()}}function next(){if(timer){clearTimeout(timer);timer=null}if(qi<qArr.length-1){qi++;quiz();return}if(mode==='study'&&qArr[0].wi<V.words.length-1){study(qArr[0].wi+1);return}vHome()}function manage(){S(`<section class="page"><div class="eyebrow">단어 관리</div><h1>전체 단어</h1><div class="manage">${V.words.map((w,i)=>{let wc=w.questions.filter(q=>state.wrong[w.word+'::'+q.question]).length;return `<button onclick="study(${i})"><b>${w.word}</b><small>${wc?'오답 '+wc:w.meaning}</small></button>`}).join('')}</div></section>`)}function L(){return T.lessons.find(x=>x.id===lessonId)}function tHome(){let l=L()||T.lessons[0];lessonId=l.id;S(`<section class="page"><div class="eyebrow">교과서 · 시험 전 대비</div><h1>지우 교과서 복습</h1><p class="desc">본문 전체 → 빠른 복원 → 핵심어 → 핵심문법 순서로 확인합니다.</p><div class="lessons">${T.lessons.map(x=>`<button class="pill ${x.id===lessonId?'active':''}" onclick="lessonId=${x.id};stage=0;tHome()">${x.id}과</button>`).join('')}</div>${stageBar()}<button class="main" onclick="go(0)">${lessonId}과 복습 시작</button></section>`)}function stageBar(){return `<div class="stagebar">${['본문 전체','빠른 복원','핵심어','핵심문법'].map((x,i)=>`<button class="stage ${stage===i?'active':''}" onclick="go(${i})"><b>${i}단계</b>${x}</button>`).join('')}</div>`}function go(n){stage=n;if(n===0)full();if(n===1){restoreIndex=0;restore()}if(n===2){mode='kw';qArr=L().keywords;qi=0;tquiz()}if(n===3){mode='gr';qArr=L().grammar;qi=0;tquiz()}}function full(){let tm={};L().restore.forEach(g=>g.sentences.forEach(s=>tm[s.en]=s.ko));S(`<section class="page"><div class="eyebrow">0단계 · 본문 전체</div><h1>${lessonId}과</h1>${stageBar()}<div class="toggle"><button class="${!showKo?'active':''}" onclick="showKo=false;full()">영어만</button><button class="${showKo?'active':''}" onclick="showKo=true;full()">영어+해석</button></div>${L().fullText.map(pg=>`<div class="textpage"><span class="label">${pg.page}</span>${pg.paragraphs.map(p=>p.map(s=>`<div class="sentence"><div class="en">${s}</div>${showKo?`<div class="ko">${tm[s]||''}</div>`:''}</div>`).join('')).join('')}</div>`).join('')}</section>`)}function mkey(s){return lessonId+'::'+s.en}function restore(){let g=L().restore[restoreIndex],items=g.sentences.map((s,i)=>({s,i})).filter(x=>!bookmarkOnly||marks[mkey(x.s)]);S(`<section class="page"><div class="eyebrow">1단계 · 빠른 복원</div><h1>${g.title}</h1>${stageBar()}<div class="tabs"><button class="pill ${bookmarkOnly?'active':''}" onclick="bookmarkOnly=!bookmarkOnly;restore()">★ 즐겨찾기만</button></div>${items.length?items.map(x=>`<div class="restore"><div class="restoretop"><button class="restoremain" onclick="document.getElementById('e${x.i}').classList.toggle('show')"><div class="ko">${x.s.ko}</div><div id="e${x.i}" class="answeren">${x.s.en}</div></button><button class="bookmark ${marks[mkey(x.s)]?'on':''}" onclick="marks[mkey(g.sentences[${x.i}])]=!marks[mkey(g.sentences[${x.i}])];saveM();restore()">${marks[mkey(x.s)]?'★':'☆'}</button></div></div>`).join(''):'<p class="desc">즐겨찾기 문장이 없습니다.</p>'}<div class="row"><button class="btn soft" onclick="if(restoreIndex>0){restoreIndex--;restore()}">이전</button><button class="btn dark" onclick="if(restoreIndex<L().restore.length-1){restoreIndex++;restore()}else go(2)">${restoreIndex===L().restore.length-1?'2단계':'다음 문단'}</button></div></section>`)}function tquiz(){locked=false;let q=qArr[qi];if(mode==='gr'){let original=q.sentence.replace(/\(\s*\)/,q.answer),wrong=q.choices.find(c=>c!==q.answer),isRight=qi%2===0,variant=q.sentence.replace(/\(\s*\)/,isRight?q.answer:wrong);q._orig=original;q._right=isRight;S(`<section class="page"><div class="eyebrow">3단계 · 핵심문법 · ${qi+1}/${qArr.length}</div><h1>${q.topic}</h1>${stageBar()}<div class="completed"><div class="serif">${variant}</div></div><div class="judgegrid"><button class="judge" onclick="gans(true)">맞음</button><button class="judge" onclick="gans(false)">틀림</button></div><div id="fb" class="feedback"></div></section>`)}else S(`<section class="page"><div class="eyebrow">2단계 · 핵심어 · ${qi+1}/${qArr.length}</div><h1>핵심어 복원</h1>${stageBar()}<div class="serif">${q.sentence}</div><div class="choices">${q.choices.map((c,i)=>`<button class="choice" onclick="kans(${i})"><b>${['①','②','③','④'][i]}</b> ${c}</button>`).join('')}</div><div id="fb" class="feedback"></div></section>`)}function kans(i){if(locked)return;locked=true;let q=qArr[qi],ok=q.choices[i]===q.answer;document.querySelectorAll('.choice').forEach((b,n)=>{b.disabled=true;if(q.choices[n]===q.answer)b.classList.add('correct');else if(n===i)b.classList.add('wrong')});$('#fb').innerHTML=`<b>${ok?'정답':'정답: '+q.answer}</b><div class="completed">${q.sentence.replace(/\(\s*\)/,q.answer)}</div>`;timer=setTimeout(tnext,ok?900:1500)}function gans(v){if(locked)return;locked=true;let q=qArr[qi],ok=v===q._right;document.querySelectorAll('.judge').forEach((b,n)=>{let val=n===0;if(val===q._right)b.classList.add('correct');else if(val===v)b.classList.add('wrong');b.disabled=true});$('#fb').innerHTML=`<b>${ok?'정답':q._right?'정답: 맞음':'정답: 틀림'}</b><div class="completed"><small>원문 확인</small><div>${q._orig}</div></div><div class="note">${q.note}</div>`;timer=setTimeout(tnext,ok?1000:1700)}function tnext(){if(qi<qArr.length-1){qi++;tquiz()}else tHome()}init();</script></body></html>
