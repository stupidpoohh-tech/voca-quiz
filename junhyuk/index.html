<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>준혁 영어 내신</title><style>:root{--bg:#f4f6f8;--paper:#fff;--ink:#101827;--navy:#17345f;--sub:#687386;--line:#d8dee7;--soft:#eef2f7;--ok:#e5f3e7;--bad:#f9e4e2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{max-width:900px;margin:auto;padding:16px 12px 44px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:900;letter-spacing:-.02em}.badge{font-size:12px;color:var(--sub)}.page{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.09em;color:var(--navy)}h1{font-size:29px;margin:6px 0 8px}.desc{color:var(--sub);line-height:1.6}.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.menu button{border:1px solid var(--line);background:#fff;padding:18px;border-radius:12px;text-align:left;font-weight:850;cursor:pointer}.menu button b{display:block;font-size:18px;margin-bottom:4px}.menu button small{color:var(--sub);font-weight:500}.menu .primary{background:var(--navy);color:#fff;border-color:var(--navy)}.menu .primary small{color:#d8e2f0}.tabs{display:flex;gap:6px;overflow:auto;margin:14px 0 18px}.tab{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px;white-space:nowrap;cursor:pointer}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}.textpage{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.label{font-size:12px;font-weight:850;background:var(--soft);padding:6px 9px;border-radius:999px}.sentence{padding:8px 0}.en{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.65}.ko{font-size:14px;color:var(--sub);line-height:1.6}.restore{padding:14px 0;border-top:1px solid var(--line)}.restore button{width:100%;border:0;background:none;text-align:left;padding:0}.answer{display:none;margin-top:8px;background:var(--soft);padding:11px;border-radius:8px;font-family:Georgia,"Times New Roman",serif}.answer.show{display:block}.serif{font-family:Georgia,"Times New Roman",serif;font-size:22px;line-height:1.62}.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.count{font-size:12px;color:var(--sub)}.choices{display:grid;gap:8px;margin-top:20px}.choice{border:1px solid var(--line);background:#fff;padding:14px;border-radius:8px;text-align:left;cursor:pointer;font-size:16px}.choice.correct{background:var(--ok)}.choice.wrong{background:var(--bad)}.choice:disabled{cursor:default}.feedback{margin-top:14px;min-height:38px}.source{background:var(--soft);border-radius:9px;padding:12px;margin-top:10px;line-height:1.55}.note{margin-top:8px;padding:11px;border-left:3px solid var(--navy);background:#f7f9fc;color:#455268;line-height:1.55}.judgegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.judge{border:1px solid var(--line);background:#fff;padding:15px;border-radius:8px;font-weight:850;cursor:pointer}.judge.correct{background:var(--ok)}.judge.wrong{background:var(--bad)}.main{width:100%;border:0;background:var(--navy);color:#fff;padding:14px;border-radius:10px;font-weight:850;cursor:pointer}.row{display:flex;gap:8px;margin-top:18px}.btn{flex:1;border:0;padding:13px;border-radius:10px;font-weight:800;cursor:pointer}.btn.soft{background:var(--soft)}.btn.dark{background:var(--navy);color:#fff}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:var(--soft);padding:12px;border-radius:10px}.stat b{display:block;font-size:21px}.wrong-list{border-top:1px solid var(--line);margin-top:15px}.wrong-list button{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:14px 2px;cursor:pointer}.wrong-list small{display:block;color:var(--sub);margin-top:4px}.homebtn{border:0;background:none;color:var(--navy);font-weight:800;cursor:pointer}.toggle{display:flex;background:var(--soft);padding:3px;border-radius:8px;width:max-content;margin:10px 0 16px}.toggle button{border:0;background:transparent;padding:7px 10px;border-radius:6px}.toggle .active{background:#fff}@media(max-width:560px){.page{padding:18px}.menu{grid-template-columns:1fr}.serif{font-size:20px}h1{font-size:25px}}</style></head><body><div class="app"><div class="top"><div class="brand">준혁 영어 내신</div><div class="badge">고2 · 시험 대비</div></div><main id="screen"></main></div><script>let DATA,L,view='full',showKo=false,qi=0,arr=[],mode='',locked=false,timer=null;let state=JSON.parse(localStorage.getItem('junhyuk-state')||'{"grammarWrong":{},"examWrong":{}}');const $=s=>document.querySelector(s),S=h=>$('#screen').innerHTML=h,save=()=>localStorage.setItem('junhyuk-state',JSON.stringify(state));const EXAM=[{s:'The two women went from home to home collecting samples from children (      ) from pertussis.',c:['suffer','suffered','suffering','to suffer'],a:2},{s:'They listened to the tragic stories of desperate parents (      ) the children struggled to breathe.',c:['as','unless','because of','despite'],a:0},{s:'The cause of the disease (      ) in 1906, but effective vaccines had not yet been developed.',c:['identified','had identified','had been identified','was identifying'],a:2},{s:'Choose the grammatically correct sentence.',c:['The bacteria which causes whooping cough were studied.','The bacteria that cause whooping cough were studied.','The bacteria who cause whooping cough were studied.','The bacteria what cause whooping cough were studied.'],a:1},{s:'Eleanor Roosevelt, (      ) husband suffered from polio, became interested in their work.',c:['who','whom','whose','which'],a:2},{s:'It was there (      ) she met fellow bacteriologist Grace Eldering.',c:['what','that','where','which'],a:1},{s:'In 1932 they started (      ) together on a vaccine for whooping cough.',c:['work','worked','working','to worked'],a:2},{s:'The difficulties they faced did not stop them (      ) toward their goal.',c:['persist','to persist','from persisting','for persisting'],a:2},{s:'They began the process of developing their vaccine (      ) samples of the bacteria.',c:['gather','gathered','by gathering','to gathering'],a:2},{s:'This allowed the bacteria (      ) into colonies that Kendrick and Eldering could analyze.',c:['grow','to grow','growing','grew'],a:1},{s:'Before they performed any clinical trials, they (      ) certain that the vaccine was safe.',c:['had to be','had being','have to been','were to being'],a:0},{s:'They injected the vaccine into themselves (      ) that it was safe.',c:['confirm','confirming','to confirm','confirmed'],a:2},{s:'(      ) the apparent success of the vaccine, they wanted further confirmation of its effectiveness.',c:['Although','Despite','Because','While'],a:1},{s:'Choose the sentence closest in meaning to: “So many lives were being saved thanks to their hard work.”',c:['Their hard work was saving many lives.','Many lives had saved their hard work.','Their hard work had been saved by many lives.','Many lives were saving their hard work.'],a:0},{s:'Kendrick and Eldering could have become very wealthy if they (      ) their vaccine.',c:['patent','patented','had patented','have patented'],a:2},{s:'The vaccine started (      ) all across the United States in 1940.',c:['distribute','distributed','being distributed','to distributing'],a:2},{s:'They conducted their first field test with 1,592 children, and none of these cases (      ) serious.',c:['was','were','being','be'],a:1},{s:'Select the best correction: “The women worked to relieve the suffering of innocent children and their families.”',c:['worked for relieve','worked relieving','worked to relieve','worked to relieving'],a:2},{s:'Which sentence is grammatically correct?',c:['Despite they lacked funds, they continued their research.','Despite of the lack of funds, they continued their research.','Despite the lack of funds, they continued their research.','Despite they had a lack of funds, they continued their research.'],a:2},{s:'Which sentence correctly expresses the unreal past situation in the passage?',c:['If they patent the vaccine, they will become wealthy.','If they patented the vaccine, they would become wealthy now.','If they had patented the vaccine, they could have become wealthy.','If they would patent the vaccine, they could become wealthy.'],a:2}];async function init(){DATA=await fetch('../textbook-extra.json?'+Date.now()).then(r=>r.json());L=DATA.lessons[0];home()}function home(){let gw=Object.values(state.grammarWrong).filter(Boolean).length,ew=Object.values(state.examWrong).filter(Boolean).length;S(`<section class="page"><div class="eyebrow">MIDTERM PREP</div><h1>Lesson 1</h1><p class="desc">Two Heroes Who Fought a Deadly Disease</p><div class="result"><div class="stat"><b>${L.restore.reduce((n,g)=>n+g.sentences.length,0)}</b><span>본문 문장</span></div><div class="stat"><b>${L.grammar.length}</b><span>핵심문법</span></div><div class="stat"><b>${gw+ew}</b><span>오답</span></div></div><div class="menu"><button class="primary" onclick="reader('full')"><b>교과서</b><small>본문 · 직독직해 · 핵심어</small></button><button onclick="grammar(false)"><b>핵심문법</b><small>원문 변형 판단 ${L.grammar.length}문제</small></button><button onclick="exam(false)"><b>예상문제</b><small>시험형 20문제</small></button><button onclick="wrongHome()"><b>오답</b><small>틀린 것만 다시 확인</small></button></div></section>`)}function head(title,sub=''){return `<div class="qhead"><div><div class="eyebrow">LESSON 1</div><h1>${title}</h1>${sub?`<p class="desc">${sub}</p>`:''}</div><button class="homebtn" onclick="home()">홈</button></div>`}function reader(v){view=v;S(`<section class="page">${head('교과서','필요한 영역으로 바로 이동합니다.')}<div class="tabs">${[['full','본문 전체'],['restore','직독직해'],['keywords','핵심어']].map(x=>`<button class="tab ${view===x[0]?'active':''}" onclick="reader('${x[0]}')">${x[1]}</button>`).join('')}</div><div id="content"></div></section>`);if(v==='full')full();if(v==='restore')restore();if(v==='keywords'){mode='kw';arr=L.keywords;qi=0;renderInnerQuiz()}}function full(){let tm={};L.restore.forEach(g=>g.sentences.forEach(s=>tm[s.en]=s.ko));$('#content').innerHTML=`<div class="toggle"><button class="${!showKo?'active':''}" onclick="showKo=false;full()">영어만</button><button class="${showKo?'active':''}" onclick="showKo=true;full()">영어+해석</button></div>${L.fullText.map(pg=>`<div class="textpage"><span class="label">${pg.page}</span>${pg.paragraphs.map(p=>p.map(s=>`<div class="sentence"><div class="en">${s}</div>${showKo?`<div class="ko">${tm[s]||''}</div>`:''}</div>`).join('')).join('')}</div>`).join('')}`}function restore(){let html=L.restore.map((g,gi)=>`<div class="textpage"><span class="label">${g.title}</span>${g.sentences.map((s,i)=>`<div class="restore"><button onclick="document.getElementById('r${gi}_${i}').classList.toggle('show')"><div class="ko">${s.ko}</div><div id="r${gi}_${i}" class="answer">${s.en}</div></button></div>`).join('')}</div>`).join('');$('#content').innerHTML=html}function renderInnerQuiz(){locked=false;let q=arr[qi];$('#content').innerHTML=`<div class="qhead"><div class="eyebrow">핵심어 · ${qi+1}/${arr.length}</div></div><div class="serif">${q.sentence}</div><div class="choices">${q.choices.map((c,i)=>`<button class="choice" onclick="kwAns(${i})"><b>${['①','②','③','④'][i]}</b> ${c}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}function kwAns(i){if(locked)return;locked=true;let q=arr[qi],ok=q.choices[i]===q.answer;document.querySelectorAll('.choice').forEach((b,n)=>{b.disabled=true;if(q.choices[n]===q.answer)b.classList.add('correct');else if(n===i)b.classList.add('wrong')});$('#fb').innerHTML=`<b>${ok?'정답':'정답: '+q.answer}</b><div class="source">${q.sentence.replace(/\(\s*\)/,q.answer)}</div>`;timer=setTimeout(()=>{if(qi<arr.length-1){qi++;renderInnerQuiz()}else reader('keywords')},ok?900:1500)}function grammar(onlyWrong){mode='grammar';arr=L.grammar.map((q,i)=>({...q,_i:i})).filter(q=>!onlyWrong||state.grammarWrong[q._i]);qi=0;if(!arr.length){S(`<section class="page">${head('문법 오답')}<p class="desc">남은 문법 오답이 없습니다.</p></section>`);return}renderGrammar()}function renderGrammar(){locked=false;let q=arr[qi],orig=q.sentence.replace(/\(\s*\)/,q.answer),wrongs=q.choices.filter(x=>x!==q.answer),isRight=qi%2===0,rep=isRight?q.answer:wrongs[(qi+1)%wrongs.length],variant=q.sentence.replace(/\(\s*\)/,rep);q._orig=orig;q._right=isRight;S(`<section class="page">${head('핵심문법')}<div class="qhead"><div class="eyebrow">문법 판단</div><div class="count">${qi+1}/${arr.length}</div></div><h1>${q.topic}</h1><div class="source"><div class="serif">${variant}</div></div><div class="judgegrid"><button class="judge" onclick="gAns(true)">맞음</button><button class="judge" onclick="gAns(false)">틀림</button></div><div id="fb" class="feedback"></div></section>`)}function gAns(v){if(locked)return;locked=true;let q=arr[qi],ok=v===q._right;document.querySelectorAll('.judge').forEach((b,n)=>{let val=n===0;if(val===q._right)b.classList.add('correct');else if(val===v)b.classList.add('wrong');b.disabled=true});state.grammarWrong[q._i]=!ok;save();$('#fb').innerHTML=`<b>${ok?'정답':q._right?'정답: 맞음':'정답: 틀림'}</b><div class="source"><small>원문 확인</small><div>${q._orig}</div></div><div class="note">${q.note}</div>`;timer=setTimeout(()=>{if(qi<arr.length-1){qi++;renderGrammar()}else home()},ok?1000:1700)}function exam(onlyWrong){mode='exam';arr=EXAM.map((q,i)=>({...q,_i:i})).filter(q=>!onlyWrong||state.examWrong[q._i]);qi=0;if(!arr.length){S(`<section class="page">${head('예상문제 오답')}<p class="desc">남은 예상문제 오답이 없습니다.</p></section>`);return}renderExam()}function renderExam(){locked=false;let q=arr[qi];S(`<section class="page">${head('예상문제')}<div class="qhead"><div class="eyebrow">TEST · ${qi+1}/${arr.length}</div></div><div class="serif">${q.s}</div><div class="choices">${q.c.map((c,i)=>`<button class="choice" onclick="eAns(${i})"><b>${['①','②','③','④'][i]}</b> ${c}</button>`).join('')}</div><div id="fb" class="feedback"></div></section>`)}function eAns(i){if(locked)return;locked=true;let q=arr[qi],ok=i===q.a;document.querySelectorAll('.choice').forEach((b,n)=>{b.disabled=true;if(n===q.a)b.classList.add('correct');else if(n===i)b.classList.add('wrong')});state.examWrong[q._i]=!ok;save();$('#fb').innerHTML=`<b>${ok?'정답':'정답: '+['①','②','③','④'][q.a]}</b>`;timer=setTimeout(()=>{if(qi<arr.length-1){qi++;renderExam()}else home()},ok?900:1500)}function wrongHome(){let gw=Object.values(state.grammarWrong).filter(Boolean).length,ew=Object.values(state.examWrong).filter(Boolean).length;S(`<section class="page">${head('오답 복습')}<div class="menu"><button onclick="grammar(true)"><b>문법 오답</b><small>${gw}문제</small></button><button onclick="exam(true)"><b>예상문제 오답</b><small>${ew}문제</small></button></div></section>`)}init();</script></body></html>
